services:
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: code_editor_piston
    restart: always
    privileged: true
    volumes:
      - piston_data:/piston

  backend:
    image: ghcr.io/mohammadyousef134/collaborativecodeeditor-backend:latest
    container_name: code_editor_backend
    restart: always
    depends_on:
      - piston
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      APP_OAUTH2_REDIRECT_URI: ${APP_OAUTH2_REDIRECT_URI}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      PISTON_URL: http://piston:2000

  websocket:
    image: ghcr.io/mohammadyousef134/collaborativecodeeditor-websocket:latest
    container_name: code_editor_websocket
    restart: always
    ports:
      - "1234:1234"

volumes:
  piston_data: